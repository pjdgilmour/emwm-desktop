[package]
name = "emwm-toolbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
gio = "0.18"
glib = "0.18"
libc = "0.2"
x11 = { version = "2.21", features = ["xlib", "xt", "xrandr"] }
emwm-tray = { path = "../tray" }
emwm-toolbox-config = { path = "../emwm-utils" }

[[bin]]
name = "xmtoolbox"
path = "src/main.rs"

[features]
test-probes = []
