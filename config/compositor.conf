# EMWM's own X11 compositor. User settings: ~/.config/emwm-desktop/compositor.conf
# Changes are detected while running; Appearance edits the same file.
[compositor]
backend=auto
vsync=true
max_fps=60
shadows=true
shadow_radius=16
shadow_offset=6
shadow_opacity=0.45
# none, zoom (Window Maker-style outlines), twist, flip
effect=zoom
duration_ms=220
fade_ms=120
