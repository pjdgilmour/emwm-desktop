# Copy to ~/.config/emwm-desktop/session.conf to customize this session.
# 1 enables a component, 0 disables it. No XFCE components are launched.
EMWM_DESKTOP_COMPOSITOR=1
EMWM_DESKTOP_TRAY=1
EMWM_DESKTOP_NETWORK=1
EMWM_DESKTOP_KEYRING=1
EMWM_DESKTOP_POLKIT=1
# xrender is the portable default. Use glx if your GPU/driver supports it well.
EMWM_DESKTOP_PICOM_BACKEND=xrender
# Optional: export GTK_THEME=your-installed-theme
# Optional monitor/keyboard commands may also be placed here.
