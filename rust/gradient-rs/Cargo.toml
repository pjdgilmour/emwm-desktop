[package]
name = "gradient-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-only"
description = "EMWM title-bar gradient preferences and Xresources"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
