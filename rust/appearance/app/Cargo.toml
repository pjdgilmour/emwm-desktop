[package]
name = "emwm-appearance"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
glib = "0.18"
gio = "0.18"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
cairo-rs = "0.18"
libc = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
x11rb = "0.13"

[[bin]]
name = "emwm-appearance"
path = "src/main.rs"

[[bin]]
name = "emwm-appearance-login"
path = "src/login.rs"
